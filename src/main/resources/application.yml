server:
  port: ${PORT:8080}

spring:
  application:
    name: todo-report
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

# Địa chỉ app Node.js (repo githubactions)
node-api:
  base-url: ${NODE_API_BASE_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
