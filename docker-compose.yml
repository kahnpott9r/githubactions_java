# Môi trường local đầy đủ: 2 app + 2 AWS emulator.
# Yêu cầu: repo githubactions nằm cạnh repo này (../githubactions).
#
#   docker compose up --build -d
#   -> Node app   : http://localhost:3000
#   -> Java app   : http://localhost:8080/api/report
#   -> LocalStack : http://localhost:4566   (health: /_localstack/health)
#   -> MiniStack  : http://localhost:4567   (health: /_ministack/health)
#
# Chỉ chạy AWS emulator:  docker compose up -d localstack ministack aws-init
# Đổi port / image: copy .env.example thành .env
#
# Lưu ý: compose ở thư mục cha (../docker-compose.yml) cũng dùng port 4566 cho
# ministack -> nếu chạy cả hai, đổi MINISTACK_PORT / LOCALSTACK_PORT trong .env.

x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1

services:
  # ---------------------------------------------------------------
  # Ứng dụng
  # ---------------------------------------------------------------
  node-app:
    build: ../githubactions
    ports:
      - "${NODE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  java-app:
    build: .
    ports:
      - "${JAVA_PORT:-8080}:8080"
    environment:
      NODE_API_BASE_URL: http://node-app:3000
    depends_on:
      node-app:
        condition: service_healthy

  # ---------------------------------------------------------------
  # AWS emulators
  # ---------------------------------------------------------------
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:4.14}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3,sqs,dynamodb
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ministack:
    image: ${MINISTACK_IMAGE:-ministackorg/ministack:latest}
    ports:
      - "${MINISTACK_PORT:-4567}:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Tạo S3 bucket, SQS queue, DynamoDB table trên cả 2 emulator rồi thoát.
  aws-init:
    image: amazon/aws-cli:2.27.0
    entrypoint: ["sh", "/scripts/init.sh"]
    environment:
      <<: *aws-env
      LOCALSTACK_ENDPOINT: http://localstack:4566
      MINISTACK_ENDPOINT: http://ministack:4566
    volumes:
      - ./infra/aws:/scripts:ro
    depends_on:
      localstack:
        condition: service_healthy
      ministack:
        condition: service_healthy
    restart: "no"
