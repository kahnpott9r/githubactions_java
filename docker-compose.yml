# Chạy 2 app ở local.
# Yêu cầu: repo githubactions nằm cạnh repo này (../githubactions).
#
#   docker compose up --build -d
#   -> Node app : http://localhost:3000
#   -> Java app : http://localhost:8080/api/report
#
# Đổi port: copy .env.example thành .env
services:
  node-app:
    build: ../githubactions
    ports:
      - "${NODE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  java-app:
    build: .
    ports:
      - "${JAVA_PORT:-8080}:8080"
    environment:
      NODE_API_BASE_URL: http://node-app:3000
    depends_on:
      node-app:
        condition: service_healthy
