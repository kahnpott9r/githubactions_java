# Môi trường local đầy đủ: 2 app + AWS emulator (MiniStack) + UI (StackPort).
# Yêu cầu: repo githubactions nằm cạnh repo này (../githubactions).
#
#   docker compose up --build -d
#   -> Node app   : http://localhost:3000
#   -> Java app   : http://localhost:8080/api/report
#   -> MiniStack  : http://localhost:4567   (AWS API, health: /_ministack/health)
#   -> StackPort  : http://localhost:8090   (UI xem tài nguyên AWS trên MiniStack)
#
# Chỉ chạy phần AWS:  docker compose up -d ministack aws-init stackport
# Đổi port / image: copy .env.example thành .env
#
# Lưu ý: compose ở thư mục cha (../docker-compose.yml) dùng port 4566 (ministack)
# và 8089 (stackport) -> stack này mặc định dùng 4567 / 8090 để chạy song song được.

x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  AWS_REGION: us-east-1

services:
  # ---------------------------------------------------------------
  # Ứng dụng
  # ---------------------------------------------------------------
  node-app:
    build: ../githubactions
    ports:
      - "${NODE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  java-app:
    build: .
    ports:
      - "${JAVA_PORT:-8080}:8080"
    environment:
      NODE_API_BASE_URL: http://node-app:3000
    depends_on:
      node-app:
        condition: service_healthy

  # ---------------------------------------------------------------
  # AWS: emulator (MiniStack) + UI (StackPort)
  # ---------------------------------------------------------------
  ministack:
    image: ${MINISTACK_IMAGE:-ministackorg/ministack:latest}
    ports:
      - "${MINISTACK_PORT:-4567}:4566"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # UI web để xem S3 / SQS / DynamoDB ... đang có trên MiniStack.
  stackport:
    image: ${STACKPORT_IMAGE:-davireis/stackport:latest}
    ports:
      - "${STACKPORT_PORT:-8090}:8080"
    environment:
      <<: *aws-env
      AWS_ENDPOINT_URL: http://ministack:4566
    depends_on:
      ministack:
        condition: service_healthy

  # Tạo S3 bucket, SQS queue, DynamoDB table trên MiniStack rồi thoát.
  aws-init:
    image: amazon/aws-cli:2.27.0
    entrypoint: ["sh", "/scripts/init.sh"]
    environment:
      <<: *aws-env
      MINISTACK_ENDPOINT: http://ministack:4566
    volumes:
      - ./infra/aws:/scripts:ro
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"
