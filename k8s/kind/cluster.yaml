# Cluster kind 1 node. Các NodePort được map ra máy host:
#   30443 -> https://localhost:8443  (ArgoCD UI)
#   30000 -> http://localhost:30000  (Node app)
#   30080 -> http://localhost:30080  (Java app)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6550
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
