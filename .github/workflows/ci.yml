name: CI

# Khi nào pipeline chạy?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      node_ref:
        description: "Branch / tag / SHA của repo githubactions (Node) để test tích hợp"
        required: false
        default: main
  # Repo githubactions (Node) bắn event này sau khi build xanh trên main
  repository_dispatch:
    types: [node-app-updated]

# Mặc định chỉ được đọc code.
permissions:
  contents: read

# Push liên tục -> huỷ run cũ của cùng branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_REPO: kahnpott9r/githubactions
  # Ref của repo Node: lấy từ dispatch payload -> input thủ công -> main
  NODE_REF: ${{ github.event.client_payload.sha || github.event.inputs.node_ref || 'main' }}
  NODE_PORT: "3000"

jobs:
  # ---------------------------------------------------------------
  # Job 1: unit test (không cần app Node)
  # ---------------------------------------------------------------
  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build & unit test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 2: integration test với app Node THẬT từ repo githubactions
  # ---------------------------------------------------------------
  integration-test:
    name: Integration test (Node @ ${{ github.event.client_payload.sha || github.event.inputs.node_ref || 'main' }})
    runs-on: ubuntu-latest
    needs: unit-test
    timeout-minutes: 20

    steps:
      - name: Checkout Java repo
        uses: actions/checkout@v4

      - name: Checkout Node repo (githubactions)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NODE_REPO }}
          ref: ${{ env.NODE_REF }}
          path: node-app
          # Repo public: github.token là đủ. Repo private: tạo secret NODE_REPO_TOKEN
          # (fine-grained PAT, quyền Contents: Read-only trên repo githubactions).
          token: ${{ secrets.NODE_REPO_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node-app/package-lock.json

      - name: Start Node app
        working-directory: node-app
        run: |
          npm ci --omit=dev
          nohup npm start > ../node-app.log 2>&1 &
        env:
          PORT: ${{ env.NODE_PORT }}

      - name: Wait for Node app to be healthy
        run: |
          curl --silent --show-error --fail \
               --retry 30 --retry-delay 1 --retry-connrefused \
               "http://localhost:${NODE_PORT}/api/health"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run integration tests
        run: ./mvnw -B -Pintegration verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
        env:
          NODE_API_BASE_URL: http://localhost:${{ env.NODE_PORT }}

      - name: Show Node app log
        if: failure()
        run: cat node-app.log

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            target/failsafe-reports
            node-app.log
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 3: chỉ chạy khi cả 2 loại test xanh -> đóng gói jar
  # ---------------------------------------------------------------
  build:
    name: Build & package
    runs-on: ubuntu-latest
    needs: integration-test
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package jar
        run: ./mvnw -B -DskipTests package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-report-${{ github.sha }}
          path: target/todo-report.jar
          retention-days: 7

  # ---------------------------------------------------------------
  # Job 4: build Docker image -> push lên GHCR (chỉ khi push vào main)
  #        PR / repository_dispatch: chỉ build để kiểm tra, không push.
  # ---------------------------------------------------------------
  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    needs: integration-test
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # cần để push image lên ghcr.io bằng GITHUB_TOKEN
    env:
      PUSH_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 🐳 Docker image"
            echo "Pushed: \`${PUSH_IMAGE}\`"
            echo '```'
            echo "${IMAGE_TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # Job: cập nhật image tag mới vào repo githubactions_gitops
  #      -> ArgoCD thấy commit mới và rolling update trên cluster.
  #      Chỉ chạy khi image đã thực sự được push (push vào main).
  # ---------------------------------------------------------------
  update-gitops:
    name: Update image tag in GitOps repo
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    env:
      GITOPS_REPO: kahnpott9r/githubactions_gitops
      APP_DIR: apps/java-app
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Check token
        id: token
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::warning::Chưa cấu hình secret GITOPS_REPO_TOKEN -> bỏ qua cập nhật repo GitOps."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout GitOps repo
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          # Fine-grained PAT chỉ cấp cho repo githubactions_gitops, quyền "Contents: Read and write"
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Set image tag, commit & push
        if: steps.token.outputs.ok == 'true'
        working-directory: gitops
        run: |
          # Trùng với tag "type=sha,prefix=sha-" của docker/metadata-action (7 ký tự)
          TAG="sha-${GITHUB_SHA::7}"
          export IMAGE TAG

          # yq có sẵn trên ubuntu-latest
          yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(TAG)' "${APP_DIR}/kustomization.yaml"
          git --no-pager diff

          if git diff --quiet; then
            echo "Tag ${TAG} đã có trong repo GitOps -> không có gì để commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "java-app: deploy ${IMAGE}:${TAG}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Repo Node và Java có thể push cùng lúc -> rebase rồi thử lại
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "Push thất bại (lần $i), thử lại..."
            sleep $((i * 3))
          done

          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::Không push được vào ${GITOPS_REPO}"; exit 1; }

          echo "### 🚀 GitOps" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${APP_DIR}\` -> \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
